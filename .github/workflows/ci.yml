name: validation

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Rebuild analysis outputs
        run: python scripts/run_analysis.py
      - name: Compare validators
        run: python experiments/compare_validators.py
      - name: Build and execute notebook
        run: |
          python scripts/build_notebook.py
          python scripts/execute_notebook.py
      - name: Validate final deliverables
        run: python scripts/validate_deliverables.py
