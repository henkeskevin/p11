[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneck-portfolio"
version = "1.0.0"
description = "Analyse reproductible des ventes, stocks, prix et marges BottleNeck"
requires-python = ">=3.12,<3.14"
dependencies = [
  "matplotlib==3.11.0",
  "nbclient==0.10.4",
  "nbformat==5.11.0",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pandas==3.0.3",
]

[project.optional-dependencies]
dev = [
  "ipykernel==7.3.0",
  "pandera[pandas]==0.32.1",
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
